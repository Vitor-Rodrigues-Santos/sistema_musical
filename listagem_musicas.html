<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem Músicas</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn461PC90ZXh0Pjwvc3ZnPg==">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="page-header-bar">
            <h2>Biblioteca Musical</h2>
            <div class="header-actions">
                <a href="index.html" class="btn-back">← Voltar ao Menu</a>
                <a href="index.html" class="btn-primary">Nova Música</a>
            </div>
        </div>
        <div class="filters">
            <form method="get" class="filter-form" action="#">
                <div class="filter-group">
                    <div class="filter-item">
                        <label for="busca">Busca Geral</label>
                        <input type="text" name="busca" id="busca" placeholder="Título, álbum ou artista...">
                    </div>
                    <div class="filter-item">
                        <label for="artista">Artista</label>
                        <select name="artista" id="artista">
                            <option value="">Todos os artistas</option>
                            <option value="1">Djavan</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="genero">Gênero</label>
                        <select name="genero" id="genero">
                            <option value="">Todos os gêneros</option>
                            <option value="MPB">MPB</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn-primary">🔍 Filtrar</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-capa">Capa</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Gênero</th>
                        <th class="col-youtube">Youtube</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td><div class="no-image">Sem<br>capa</div></td>
                        <td>Oceano</td>
                        <td>Djavan</td>
                        <td>Luz</td>
                        <td>MPB</td>
                        <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">🗑️</a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><div class="no-image">Sem<br>capa</div></td>
                        <td>Infinito Particular</td>
                        <td>Marisa Monte</td>
                        <td>-</td> <!-- Sem álbum, logo mostramos "-"-->
                        <td>MPB</td>
                        <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">🗑️</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
